name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Application
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Verify Tkinter
        run: |
          python -c "import tkinter; print('Tkinter is available')"

      - name: Download and Bundle FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "vendor/ffmpeg/bin"
          Invoke-WebRequest -Uri "https://github.com/ffbinaries/ffbinaries-prebuilt/releases/download/v6.1/ffmpeg-6.1-win-64.zip" -OutFile "ffmpeg.zip"
          Invoke-WebRequest -Uri "https://github.com/ffbinaries/ffbinaries-prebuilt/releases/download/v6.1/ffprobe-6.1-win-64.zip" -OutFile "ffprobe.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "vendor/ffmpeg/bin" -Force
          Expand-Archive -Path "ffprobe.zip" -DestinationPath "vendor/ffmpeg/bin" -Force
          Remove-Item "ffmpeg.zip"
          Remove-Item "ffprobe.zip"

      - name: Build Executable
        run: |
          python -m PyInstaller ytd_gui.spec --clean --noconfirm

      - name: Determine Tag
        id: get_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Zip Build Output
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/YT Downloader" -DestinationPath "dist/YT-Downloader-${{ steps.get_tag.outputs.tag }}.zip"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ steps.get_tag.outputs.tag }}" "dist/YT-Downloader-${{ steps.get_tag.outputs.tag }}.zip" \
            --title "Release ${{ steps.get_tag.outputs.tag }}" \
            --generate-notes || \
          gh release upload "${{ steps.get_tag.outputs.tag }}" "dist/YT-Downloader-${{ steps.get_tag.outputs.tag }}.zip" \
            --clobber
